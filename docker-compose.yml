services:

  # ============================================================
  # Kafka-compatible event broker
  # ============================================================

  kafka:
    image: redpandadata/redpanda:v24.3.5
    container_name: kafka
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --check=false
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://kafka:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - kafka_data:/var/lib/redpanda/data

  # ============================================================
  # Identity Services
  # ============================================================

  identity-db:
    image: postgres:latest
    container_name: identity-db

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${IDENTITY_DB_NAME}

    ports:
      - "${IDENTITY_DB_PORT}:5432"

    volumes:
      - identity_data:/var/lib/postgresql/data


  identity_svc:
    build:
      context: .
      dockerfile: identity/Dockerfile

    container_name: identity_svc

    # No host port mapping.
    # The API Gateway is the only external entry point.
    # Internal URL:
    # http://identity_svc:8080

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # TLS is terminated at the gateway; internal traffic is plain HTTP.
      DISABLE_HTTPS_REDIRECTION: "true"

      # Identity/Program.cs reads "IdentityDatabase" specifically.
      ConnectionStrings__IdentityDatabase: >-
        Host=identity-db;
        Database=${IDENTITY_DB_NAME};
        Username=${DB_USER};
        Password=${DB_PASSWORD}
      Kafka__BootstrapServers: kafka:9092

    depends_on:
      - identity-db
      - kafka


  # ============================================================
  # Resource Services
  # ============================================================

  resource-db:
    image: postgres:latest
    container_name: resource-db

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${RESOURCE_DB_NAME}

    ports:
      - "${RESOURCE_DB_PORT}:5432"

    volumes:
      - resource_data:/var/lib/postgresql/data


  resource_svc:
    build:
      context: .
      dockerfile: resource/Dockerfile

    container_name: resource_svc

    # No host port mapping.
    # Internal URL:
    # http://resource_svc:8080

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # TLS is terminated at the gateway; internal traffic is plain HTTP.
      DISABLE_HTTPS_REDIRECTION: "true"

      # Resource/Program.cs reads "ResourceDatabase" specifically.
      ConnectionStrings__ResourceDatabase: >-
        Host=resource-db;
        Database=${RESOURCE_DB_NAME};
        Username=${DB_USER};
        Password=${DB_PASSWORD}
      Kafka__BootstrapServers: kafka:9092

    depends_on:
      - resource-db
      - kafka


  # ============================================================
  # Authorization Services
  # ============================================================

  authorization-db:
    image: postgres:latest
    container_name: authorization-db

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${AUTHORIZATION_DB_NAME}

    ports:
      - "${AUTHORIZATION_DB_PORT}:5432"

    volumes:
      - authorization_data:/var/lib/postgresql/data


  authorization_svc:
    build:
      context: .
      dockerfile: AuthorizationService/Dockerfile

    container_name: authorization_svc

    # No host port mapping.
    # Internal URL:
    # http://authorization_svc:8080

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # TLS is terminated at the gateway; internal traffic is plain HTTP.
      DISABLE_HTTPS_REDIRECTION: "true"

      # AuthorizationService/Program.cs reads "AuthorizationDatabase" ONLY (no
      # DefaultConnection fallback). Without this override the service falls back
      # to the appsettings.json value (Host=localhost;Port=5433), which inside a
      # container points at the container itself, not authorization-db — so every
      # query fails and ApprovalGrantedConsumer never creates a permission.
      ConnectionStrings__AuthorizationDatabase: >-
        Host=authorization-db;
        Database=${AUTHORIZATION_DB_NAME};
        Username=${DB_USER};
        Password=${DB_PASSWORD}
      Kafka__BootstrapServers: kafka:9092

      # Azure JIT cloud provisioning. Left empty by default: when these are not
      # set, AzureJitOptions.IsConfigured is false and the service falls back to
      # NoOpJitProvisioner (sessions are recorded as LOCAL_ONLY but still expire).
      # Fill in .env to provision real Azure RBAC role assignments.
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID:-}
      AZURE_RESOURCE_GROUP: ${AZURE_RESOURCE_GROUP:-}
      AZURE_PRINCIPAL_ID: ${AZURE_PRINCIPAL_ID:-}

      # ------------------------------------------------------------------
      # Brokered JIT terminal (optional).
      # Without these the /api/jit/terminal endpoint refuses every connect
      # with "not configured" and the UI hides the terminal button.
      #
      # JIT_SSH_PRIVATE_KEY_PATH is preferred over inline PEM: mount the key
      # as a read-only secret and point at it, which avoids the newline
      # mangling that inline keys suffer in environment variables.
      # ------------------------------------------------------------------
      JitSsh__PrivateKeyPath: ${JIT_SSH_PRIVATE_KEY_PATH:-}
      JitSsh__PrivateKey: ${JIT_SSH_PRIVATE_KEY:-}
      JitSsh__Passphrase: ${JIT_SSH_PASSPHRASE:-}
      # Force a single shared SSH account. Leave blank to log in as each
      # session's own user (the account Azure creates on the VM, matching the
      # `ssh user@vm` command shown in the UI).
      JitSsh__Username: ${JIT_SSH_USERNAME:-}
      JitSsh__UsernameTemplate: ${JIT_SSH_USERNAME_TEMPLATE:-}
      JitSsh__Port: ${JIT_SSH_PORT:-22}
      JitSsh__HostKeyFingerprint: ${JIT_SSH_HOST_KEY_FINGERPRINT:-}
      # Per-user keys live in a mounted directory, one file per SSH login
      # (e.g. keys/user@example.com). This is the practical way to supply them:
      # Compose cannot generate a dynamic env var name per user, but it can
      # mount a volume. The broker picks the file matching the session's login
      # before falling back to the shared key above.
      JitSsh__PrivateKeyDirectory: ${JIT_SSH_PRIVATE_KEY_DIRECTORY:-}

    # Sibling of `environment`, not a child: Compose reads `volumes` as a
    # top-level service key, so nesting it under `environment` makes the whole
    # file fail `docker compose config` validation.
    #
    # Per-user keys live here, one PEM file per SSH login, named after the login
    # (e.g. jit-keys/user@example.com). A mounted volume is the only practical
    # way to supply these: Compose cannot generate a dynamic env var name per
    # user. The broker picks the file matching the session's login, and only
    # falls back to the shared key above.
    volumes:
      - ${JIT_SSH_KEYS_HOST_DIR:-./jit-keys}:/var/run/bismarck/ssh-keys:ro

    depends_on:
      - authorization-db
      - identity_svc
      - resource_svc
      - kafka


  # ============================================================
  # Approval Services
  # ============================================================

  approval-db:
    image: postgres:latest
    container_name: approval-db

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${APPROVAL_DB_NAME}

    ports:
      - "${APPROVAL_DB_PORT}:5432"

    volumes:
      - approval_data:/var/lib/postgresql/data


  approval_svc:
    build:
      context: .
      dockerfile: Approval/Dockerfile

    container_name: approval_svc

    # No host port mapping.
    # Internal URL:
    # http://approval_svc:8080

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # TLS is terminated at the gateway; internal traffic is plain HTTP.
      DISABLE_HTTPS_REDIRECTION: "true"

      # Approval/Program.cs reads "ApprovalDatabase" first, then "DefaultConnection".
      ConnectionStrings__ApprovalDatabase: >-
        Host=approval-db;
        Database=${APPROVAL_DB_NAME};
        Username=${DB_USER};
        Password=${DB_PASSWORD}
      Kafka__BootstrapServers: kafka:9092

    depends_on:
      - authorization-db
      - identity_svc
      - resource_svc
      - approval-db
      - kafka


  # ============================================================
  # Audit Services
  # ============================================================

  audit-db:
    image: postgres:latest
    container_name: audit-db

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${AUDIT_DB_NAME}

    ports:
      - "${AUDIT_DB_PORT}:5432"

    volumes:
      - audit_data:/var/lib/postgresql/data


  audit_svc:
    build:
      context: .
      dockerfile: Audit/Dockerfile

    container_name: audit_svc

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # TLS is terminated at the gateway; internal traffic is plain HTTP.
      DISABLE_HTTPS_REDIRECTION: "true"
      ConnectionStrings__AuditDatabase: >-
        Host=audit-db;
        Database=${AUDIT_DB_NAME};
        Username=${DB_USER};
        Password=${DB_PASSWORD}
      Kafka__BootstrapServers: kafka:9092
      Kafka__GroupId: bismarck-audit-service

    depends_on:
      - audit-db
      - kafka


  # ============================================================
  # Analytics Services (BIS-402)
  # ============================================================

  analytics-db:
    image: postgres:latest
    container_name: analytics-db

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${ANALYTICS_DB_NAME}

    ports:
      - "${ANALYTICS_DB_PORT}:5432"

    volumes:
      - analytics_data:/var/lib/postgresql/data


  analytics_svc:
    build:
      context: .
      dockerfile: Analytics/Dockerfile

    container_name: analytics_svc

    # No host port mapping.
    # The API Gateway is the only external entry point.
    # Internal URL:
    # http://analytics_svc:8080

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # TLS is terminated at the gateway; internal traffic is plain HTTP.
      DISABLE_HTTPS_REDIRECTION: "true"

      # Analytics/Program.cs reads "AnalyticsDatabase" specifically.
      ConnectionStrings__AnalyticsDatabase: >-
        Host=analytics-db;
        Database=${ANALYTICS_DB_NAME};
        Username=${DB_USER};
        Password=${DB_PASSWORD}
      Kafka__BootstrapServers: kafka:9092
      # Must NOT be the Audit consumer group: consumer groups split a topic
      # between their members, so reusing bismarck-audit-service would stop
      # Analytics from receiving its own copy of the event stream.
      Kafka__GroupId: bismarck-analytics-service

      # Same HS256 signing key as Identity Service. Passed from the host
      # environment like the other secret-bearing variables; never hard-coded.
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}

    depends_on:
      - analytics-db
      - kafka


  # ============================================================
  # Notification Services
  # ============================================================

  notification-db:
    image: postgres:latest
    container_name: notification-db

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}

    ports:
      - "${NOTIFICATION_DB_PORT}:5432"

    volumes:
      - notification_data:/var/lib/postgresql/data



  notification_svc:
    build:
      context: .
      dockerfile: Notification/Dockerfile
    container_name: notification_svc

    # No host port mapping.
    # The API Gateway is the only external entry point.
    # Internal URL:
    # http://notification_svc:8080

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # TLS is terminated at the gateway; internal traffic is plain HTTP.
      DISABLE_HTTPS_REDIRECTION: "true"

      # Notification/Program.cs reads "NotificationDatabase" ONLY (no
      # DefaultConnection fallback). Without this override it falls back to the
      # appsettings.json value (Host=localhost), which is unreachable inside the
      # container, so no notification is ever written.
      ConnectionStrings__NotificationDatabase: >-
        Host=notification-db;
        Database=${NOTIFICATION_DB_NAME};
        Username=${DB_USER};
        Password=${DB_PASSWORD}
      Kafka__BootstrapServers: kafka:9092
      Kafka__GroupId: bismarck-notification-service

    depends_on:
      - notification-db
      - kafka


  # ============================================================
  # API Gateway
  # ============================================================

  gateway_svc:
    build:
      context: .
      dockerfile: gateway/Dockerfile

    container_name: gateway_svc

    # Single external entry point for browser/CLI/third-party
    # clients.
    ports:
      - "${GATEWAY_PORT}:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # TLS is terminated at the gateway; internal traffic is plain HTTP.
      DISABLE_HTTPS_REDIRECTION: "true"

      # Internal Docker Compose service URLs.
      Services__Identity__Url: http://identity_svc:8080
      Services__Resource__Url: http://resource_svc:8080
      Services__Authorization__Url: http://authorization_svc:8080
      Services__Approval__Url: http://approval_svc:8080
      Services__Audit__Url: http://audit_svc:8080
      Services__Notification__Url: http://notification_svc:8080
      Services__Analytics__Url: http://analytics_svc:8080

      # Frontend origin(s) accepted by the gateway CORS policy.
      AllowedOrigins__0: ${ALLOWED_ORIGINS}

    depends_on:
      - identity_svc
      - resource_svc
      - authorization_svc
      - approval_svc
      - notification_svc
      - audit_svc
      - analytics_svc


# ============================================================
# Persistent Volumes
# ============================================================

volumes:
  kafka_data:
  identity_data:
  resource_data:
  authorization_data:
  approval_data:
  audit_data:
  notification_data:
  analytics_data:
services:
  identity-svc:
    build:
      context: ./identity
      dockerfile: Dockerfile
    container_name: identity-service
    # No host port mapping: the API Gateway is the only entry point from outside
    # the compose network (architecture rule #4). Reachable on the internal
    # network as http://identity-service:8080.
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__IdentityDb=${ConnectionStrings__IdentityDb}
    restart: unless-stopped

  resource-svc:
    build:
      context: ./resource
      dockerfile: Dockerfile
    container_name: resource-service
    # No host port mapping — see identity-service note above.
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=resource-db;Database=${RESOURCE_DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
    depends_on:
      - resource-db

  # --- API Gateway ---
  # Single external entry point for browser/CLI/third-party clients. All
  # external traffic goes through here; services are only reachable on the
  # internal Docker network.
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "${GATEWAY_PORT}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Downstream URLs come from the Services config section (env-var friendly:
      # Services__Identity__Url, Services__Resource__Url). These use the Docker
      # Compose service names on the internal network.
      - Services__Identity__Url=http://identity-service:8080
      - Services__Resource__Url=http://resource-service:8080
      # Frontend origin(s) the gateway's CORS policy will accept.
      - AllowedOrigins__0=${ALLOWED_ORIGINS}
    depends_on:
      - identity-service
      - resource-service

volumes:
  identity_data:
  resource_data:

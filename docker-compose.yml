services:
  identity-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${IDENTITY_DB_NAME:-identity_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - identity_data:/var/lib/postgresql/data

  identity-svc:
    build:
      context: ./identity
      dockerfile: Dockerfile
    container_name: identity-service
    # No host port mapping: the API Gateway is the only entry point from outside
    # the compose network (architecture rule #4). Reachable on the internal
    # network as http://identity-service:8080.
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DISABLE_HTTPS_REDIRECTION=true
      - ConnectionStrings__IdentityDatabase=Host=identity-db;Database=${IDENTITY_DB_NAME:-identity_db};Username=${DB_USER:-postgres}
      - IDENTITY_DB_PASSWORD=${DB_PASSWORD:-postgres}
      - JWT_SIGNING_KEY=${JWT_SIGNING_KEY:-local-development-signing-key-at-least-32-characters}
    depends_on:
      - identity-db
    restart: unless-stopped

  resource-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${RESOURCE_DB_NAME:-resource_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - resource_data:/var/lib/postgresql/data

  resource-svc:
    build:
      context: ./resource
      dockerfile: Dockerfile
    container_name: resource-service
    # No host port mapping — see identity-service note above.
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DISABLE_HTTPS_REDIRECTION=true
      - ConnectionStrings__ResourceDatabase=Host=resource-db;Database=${RESOURCE_DB_NAME:-resource_db};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-postgres}
      - RESOURCE_DB_PASSWORD=${DB_PASSWORD:-postgres}
      - JWT_SIGNING_KEY=${JWT_SIGNING_KEY:-local-development-signing-key-at-least-32-characters}
    depends_on:
      - resource-db

  authorization-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${AUTHORIZATION_DB_NAME:-authorization_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - authorization_data:/var/lib/postgresql/data

  authorization-svc:
    build:
      context: ./AuthorizationService
      dockerfile: Dockerfile
    container_name: authorization-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DISABLE_HTTPS_REDIRECTION=true
      - ConnectionStrings__AuthorizationDatabase=Host=authorization-db;Database=${AUTHORIZATION_DB_NAME:-authorization_db};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-postgres}
      - IDENTITY_SERVICE_URL=http://identity-svc:8080/
      - RESOURCE_SERVICE_URL=http://resource-svc:8080/
    depends_on:
      - authorization-db
      - identity-svc
      - resource-svc

  # --- API Gateway ---
  # Single external entry point for browser/CLI/third-party clients. All
  # external traffic goes through here; services are only reachable on the
  # internal Docker network.
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Downstream URLs come from the Services config section (env-var friendly:
      # Services__Identity__Url, Services__Resource__Url). These use the Docker
      # Compose service names on the internal network.
      - Services__Identity__Url=http://identity-svc:8080
      - Services__Resource__Url=http://resource-svc:8080
      - Services__Authorization__Url=http://authorization-svc:8080
      # Frontend origin(s) the gateway's CORS policy will accept.
      - AllowedOrigins__0=${ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      - identity-svc
      - resource-svc
      - authorization-svc

volumes:
  identity_data:
  resource_data:
  authorization_data:

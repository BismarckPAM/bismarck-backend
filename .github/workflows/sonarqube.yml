name: SonarQube Code Quality & Coverage

on:
  push:
    branches:
      - main
      - dev
      - deploy/production
  pull_request:
    branches:
      - main
      - deploy/production
  workflow_dispatch: # Adds manual "Run workflow" button in GitHub Actions UI for live demo

jobs:
  sonar-analysis:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout full git history (mandatory for Sonar line blame & new code detection)
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup .NET 10 SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3. Setup Java 17 (Required by SonarScanner engine)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Install SonarScanner CLI tool
      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      # 5. Restore service dependencies
      - name: Restore Service Dependencies
        run: |
          for service in identity resource AuthorizationService Approval Audit Notification Analytics gateway; do
            dotnet restore "./$service"
          done

      # 6. Begin SonarQube Scan
      - name: Begin SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          dotnet sonarscanner begin \
            /k:"bismarck-backend" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml" \
            /d:sonar.cs.vstest.reportsPaths="**/TestResults/**/*.trx" \
            /d:sonar.coverage.exclusions="**/*Tests*/**,**/Migrations/**"

      # 7. Build all microservices
      - name: Build All Services
        run: |
          for service in identity resource AuthorizationService Approval Audit Notification Analytics gateway; do
            dotnet build "./$service" --no-restore --configuration Release
          done

      # 8. Run tests, generate OpenCover XML reports, and output TRX test results
      - name: Run Tests & Collect Coverage
        run: |
          set -euo pipefail
          find . -type f -name '*Tests.csproj' -print0 | while IFS= read -r -d '' test_project; do
            dotnet test "$test_project" \
              --configuration Release \
              --logger "trx" \
              --collect:"XPlat Code Coverage" \
              --results-directory ./TestResults \
              -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
          done

          report_count="$(find ./TestResults -type f -name 'coverage.opencover.xml' | wc -l)"
          if [ "$report_count" -eq 0 ]; then
            echo "No OpenCover coverage reports were generated." >&2
            exit 1
          fi

          trx_count="$(find ./TestResults -type f -name '*.trx' | wc -l)"
          if [ "$trx_count" -eq 0 ]; then
            echo "No TRX test reports were generated." >&2
            exit 1
          fi

      # 9. End SonarQube Scan (Uploads coverage and code metrics to your EC2 instance)
      - name: End SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      # 10. Archive test artifacts in GitHub Actions
      - name: Upload Test Results Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-results
          path: ./TestResults/

# End of workflow

name: Trigger auto deployment for notification-svc

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ deploy/production ]
    paths:
    - '**'
    - '.github/workflows/notification-svc-AutoDeployTrigger-7c21f1ab-9aa5-48f3-b649-fc72d75bc334.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.NOTIFICATIONSVC_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.NOTIFICATIONSVC_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.NOTIFICATIONSVC_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}Notification
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: bismarckregistry.azurecr.io
          registryUsername: ${{ secrets.NOTIFICATIONSVC_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.NOTIFICATIONSVC_REGISTRY_PASSWORD }}
          containerAppName: notification-svc
          resourceGroup: bismarck-pam-rg
          imageToBuild: bismarckregistry.azurecr.io/notification-svc:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_



name: Trigger auto deployment for approval-svc

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ deploy/production ]
    paths:
    - '**'
    - '.github/workflows/approval-svc-AutoDeployTrigger-060ece86-d060-47ca-8921-942b30370ba5.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APPROVALSVC_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.APPROVALSVC_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.APPROVALSVC_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}approval
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: bismarckregistry.azurecr.io
          registryUsername: ${{ secrets.APPROVALSVC_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.APPROVALSVC_REGISTRY_PASSWORD }}
          containerAppName: approval-svc
          resourceGroup: bismarck-pam-rg
          imageToBuild: bismarckregistry.azurecr.io/approval-svc:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_



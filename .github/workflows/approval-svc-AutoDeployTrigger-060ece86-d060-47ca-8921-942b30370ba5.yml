name: Trigger auto deployment for approval-svc

# When this action will be executed
on:
  # Trigger only when changes are made inside the approval folder or its workflow
  push:
    branches: 
      [ deploy/production ]
    paths:
      - 'Approval/**'       
      - '.github/workflows/approval-svc-AutoDeployTrigger-060ece86-d060-47ca-8921-942b30370ba5.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write # Required for requesting the OIDC JWT Token
      contents: read  # Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: bismarckregistry.azurecr.io
          username: ${{ secrets.APPROVALSVC_REGISTRY_USERNAME }}
          password: ${{ secrets.APPROVALSVC_REGISTRY_PASSWORD }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Approval/Dockerfile
          push: true
          tags: bismarckregistry.azurecr.io/approval-svc:${{ github.sha }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APPROVALSVC_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.APPROVALSVC_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.APPROVALSVC_AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container App
        uses: azure/cli@v2
        with:
          inlineScript: |
            az config set extension.use_dynamic_install=yes_without_prompt
            az containerapp update \
              --name approval-svc \
              --resource-group bismarck-pam-rg \
              --image bismarckregistry.azurecr.io/approval-svc:${{ github.sha }}
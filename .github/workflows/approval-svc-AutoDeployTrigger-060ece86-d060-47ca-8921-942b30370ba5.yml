name: Trigger auto deployment for approval-svc

# When this action will be executed
on:
  # Trigger only when changes are made inside the approval folder or its workflow
  push:
    branches: 
      [ deploy/production ]
    paths:
      - 'approval/**'       
      - '.github/workflows/approval-svc-AutoDeployTrigger-060ece86-d060-47ca-8921-942b30370ba5.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write # Required for requesting the OIDC JWT Token
      contents: read  # Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APPROVALSVC_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.APPROVALSVC_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.APPROVALSVC_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          # Use workspace root as context so Docker can resolve solution files/projects
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: approval/Dockerfile   
          registryUrl: bismarckregistry.azurecr.io
          registryUsername: ${{ secrets.APPROVALSVC_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.APPROVALSVC_REGISTRY_PASSWORD }}
          containerAppName: approval-svc
          resourceGroup: bismarck-pam-rg
          imageToBuild: bismarckregistry.azurecr.io/approval-svc:${{ github.sha }}
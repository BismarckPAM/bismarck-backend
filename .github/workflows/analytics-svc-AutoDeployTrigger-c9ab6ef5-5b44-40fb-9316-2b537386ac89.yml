
name: Trigger auto deployment for analytics-svc

on:
  push:
    branches:
      - deploy/production
    paths:
      - 'Analytics/**'
      - 'BuildingBlocks/**'
      - '.github/workflows/analytics-svc-AutoDeployTrigger-c9ab6ef5-5b44-40fb-9316-2b537386ac89.yml'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ANALYTICSSVC_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.ANALYTICSSVC_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ANALYTICSSVC_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Analytics/Dockerfile
          registryUrl: bismarckregistry.azurecr.io
          registryUsername: ${{ secrets.ANALYTICSSVC_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.ANALYTICSSVC_REGISTRY_PASSWORD }}
          containerAppName: analytics-svc
          resourceGroup: bismarck-pam-rg
          imageToBuild: bismarckregistry.azurecr.io/analytics-svc:${{ github.sha }}

name: Trigger auto deployment for gateway

# When this action will be executed
on:
  # Automatically trigger it only when changes are made inside the gateway folder
  push:
    branches: 
      [ deploy/production ]
    paths:
      - 'gateway/**'
      - 'BuildingBlocks/**'
      - '.github/workflows/gateway-AutoDeployTrigger-d18edf34-4f00-4c85-b078-b6ee1f2baa46.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write # Required for requesting the OIDC JWT Token
      contents: read  # Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: bismarckregistry.azurecr.io
          username: ${{ secrets.GATEWAY_REGISTRY_USERNAME }}
          password: ${{ secrets.GATEWAY_REGISTRY_PASSWORD }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          # Build context MUST be the repository root.
          context: .
          file: gateway/Dockerfile
          push: true
          tags: bismarckregistry.azurecr.io/gateway:${{ github.sha }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.GATEWAY_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.GATEWAY_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.GATEWAY_AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container App
        uses: azure/cli@v2
        with:
          inlineScript: |
            az config set extension.use_dynamic_install=yes_without_prompt
            az containerapp update \
              --name gateway \
              --resource-group bismarck-pam-rg \
              --image bismarckregistry.azurecr.io/gateway:${{ github.sha }}


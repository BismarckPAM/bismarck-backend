name: Trigger auto deployment for gateway

# When this action will be executed
on:
  # Automatically trigger it only when changes are made inside the gateway folder
  push:
    branches: 
      [ deploy/production ]
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway-AutoDeployTrigger-d18edf34-4f00-4c85-b078-b6ee1f2baa46.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write # Required for requesting the OIDC JWT Token
      contents: read  # Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.GATEWAY_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.GATEWAY_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.GATEWAY_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/gateway
          dockerfilePath: Dockerfile
          registryUrl: bismarckregistry.azurecr.io
          registryUsername: ${{ secrets.GATEWAY_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.GATEWAY_REGISTRY_PASSWORD }}
          containerAppName: gateway
          resourceGroup: bismarck-pam-rg
          imageToBuild: bismarckregistry.azurecr.io/gateway:${{ github.sha }}

name: Trigger auto deployment for audit-svc

# When this action will be executed
on:
  # Trigger only when changes are made inside the Audit folder or this workflow
  push:
    branches: 
      [ deploy/production ]
    paths:
      - 'Audit/**'
      - 'BuildingBlocks/**'
      - '.github/workflows/audit-svc-AutoDeployTrigger-6097bb5a-a2cc-44b0-a858-8a09a82aadfc.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write # Required for requesting the OIDC JWT Token
      contents: read  # Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: bismarckregistry.azurecr.io
          username: ${{ secrets.AUDITSVC_REGISTRY_USERNAME }}
          password: ${{ secrets.AUDITSVC_REGISTRY_PASSWORD }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          # Build context MUST be the repository root: Audit/Dockerfile copies
          # BuildingBlocks/Messaging/, a SIBLING of Audit/.
          context: .
          file: Audit/Dockerfile
          push: true
          tags: bismarckregistry.azurecr.io/audit-svc:${{ github.sha }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AUDITSVC_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AUDITSVC_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AUDITSVC_AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container App
        uses: azure/cli@v2
        with:
          inlineScript: |
            az config set extension.use_dynamic_install=yes_without_prompt
            az containerapp update \
              --name audit-svc \
              --resource-group bismarck-pam-rg \
              --image bismarckregistry.azurecr.io/audit-svc:${{ github.sha }}
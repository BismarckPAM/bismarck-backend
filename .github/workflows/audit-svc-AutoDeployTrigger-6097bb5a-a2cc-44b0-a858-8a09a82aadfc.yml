name: Trigger auto deployment for audit-svc

# When this action will be executed
on:
  # Trigger only when changes are made inside the Audit folder or this workflow
  push:
    branches: 
      [ deploy/production ]
    paths:
      - 'Audit/**'
      - '.github/workflows/audit-svc-AutoDeployTrigger-6097bb5a-a2cc-44b0-a858-8a09a82aadfc.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write # Required for requesting the OIDC JWT Token
      contents: read  # Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AUDITSVC_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AUDITSVC_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AUDITSVC_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Audit/Dockerfile
          registryUrl: bismarckregistry.azurecr.io
          registryUsername: ${{ secrets.AUDITSVC_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.AUDITSVC_REGISTRY_PASSWORD }}
          containerAppName: audit-svc
          resourceGroup: bismarck-pam-rg
          imageToBuild: bismarckregistry.azurecr.io/audit-svc:${{ github.sha }}
name: Bismarck PAM CI/CD

on:
  push:
    branches:
      - deploy/production
      - main

  pull_request:
    branches:
      - deploy/production
      - main


jobs:

  # ============================================================
  # 1. CI - Build & Test
  # ============================================================

  test-and-verify:
    name: Test & Build (${{ matrix.service }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        service:
          - identity
          - resource
          - gateway

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup .NET
      # --------------------------------------------------------

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'


      # --------------------------------------------------------
      # Restore Dependencies
      # --------------------------------------------------------

      - name: Restore Dependencies
        run: dotnet restore ./${{ matrix.service }}


      # --------------------------------------------------------
      # Build Service
      # --------------------------------------------------------

      - name: Build Service
        run: |
          dotnet build ./${{ matrix.service }} \
            --no-restore \
            --configuration Release


      # ========================================================
      # Identity Tests
      # ========================================================

      - name: Run Identity Unit Tests
        if: matrix.service == 'identity'
        run: |
          dotnet test \
            ./identity/Identity.Service.Tests/Identity.Service.Tests.csproj \
            --configuration Release \
            --no-restore \
            --verbosity normal


      - name: Run Identity Integration Tests
        if: matrix.service == 'identity'
        run: |
          dotnet test \
            ./identity/Identity.Service.IntegrationTests/Identity.Service.IntegrationTests.csproj \
            --configuration Release \
            --no-restore \
            --verbosity normal


      # ========================================================
      # Resource Tests
      # ========================================================

      - name: Run Resource Unit Tests
        if: matrix.service == 'resource'
        run: |
          dotnet test \
            ./resource/Resource.Service.Tests/Resource.Service.Tests.csproj \
            --configuration Release \
            --no-restore \
            --verbosity normal


      - name: Run Resource Integration Tests
        if: matrix.service == 'resource'
        run: |
          dotnet test \
            ./resource/Resource.Service.IntegrationTests/Resource.Service.IntegrationTests.csproj \
            --configuration Release \
            --no-restore \
            --verbosity normal


      # ========================================================
      # Gateway
      #
      # Gateway currently has no test project based on the
      # structure you provided.
      # ========================================================

      - name: Gateway Test Status
        if: matrix.service == 'gateway'
        run: |
          echo "Gateway build completed successfully."
          echo "No Gateway test project is currently configured."


  # ============================================================
  # 2. CI - Validate Docker Compose
  # ============================================================

  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    needs:
      - test-and-verify

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Docker Buildx
      # --------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # --------------------------------------------------------
      # Create CI Environment
      #
      # These values exist ONLY for Compose validation/build.
      # They are not production credentials.
      # --------------------------------------------------------

      - name: Create CI Environment File
        run: |
          cat > .env <<'EOF'
          DB_USER=ci_user
          DB_PASSWORD=ci_password

          IDENTITY_DB_NAME=identity_db
          RESOURCE_DB_NAME=resource_db

          IDENTITY_DB_PORT=5433
          RESOURCE_DB_PORT=5434

          GATEWAY_PORT=8080

          ALLOWED_ORIGINS=http://localhost:3000
          EOF


      # --------------------------------------------------------
      # Validate Docker Compose
      # --------------------------------------------------------

      - name: Validate Docker Compose
        run: |
          docker compose config


      # --------------------------------------------------------
      # Build Docker Compose Services
      #
      # identity_svc
      # resource_svc
      # gateway_svc
      #
      # PostgreSQL images are pulled from Docker Hub.
      # --------------------------------------------------------

      - name: Build Docker Compose Services
        run: |
          docker compose build


      # --------------------------------------------------------
      # Cleanup
      # --------------------------------------------------------

      - name: Clean Up
        if: always()
        run: |
          docker compose down -v


  # ============================================================
  # 3. CD - Build & Push Images to Azure Container Registry
  # ============================================================

  build-and-push-acr:
    name: Build & Push Docker Image (${{ matrix.service }})

    needs:
      - test-and-verify
      - validate-compose

    # Only push on actual pushes to main or deploy/production.
    # Pull requests never push images to ACR.
    if: >
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/deploy/production' ||
        github.ref == 'refs/heads/main'
      )

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:

          - service: identity
            image_name: identity_svc

          - service: resource
            image_name: resource_svc

          - service: gateway
            image_name: gateway_svc


    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Docker Buildx
      # --------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # --------------------------------------------------------
      # Login to Azure Container Registry
      # --------------------------------------------------------

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}


      # --------------------------------------------------------
      # Build & Push Docker Image
      # --------------------------------------------------------

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile

          push: true

          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.image_name }}:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.image_name }}:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max
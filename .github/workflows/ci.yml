name: Bismarck PAM CI/CD

on:
  push:
    branches:
      - deploy/production

  pull_request:
    branches:
      - deploy/production


jobs:

  # ============================================================
  # 1. CI - Build & Test
  # ============================================================

  test-and-verify:
    name: Test & Build (${{ matrix.service }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        service:
          - identity
          - resource
          - AuthorizationService
          - gateway

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup .NET
      # --------------------------------------------------------

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'


      # --------------------------------------------------------
      # Restore Service Dependencies
      # --------------------------------------------------------

      - name: Restore Service Dependencies
        run: |
          dotnet restore ./${{ matrix.service }}


      # --------------------------------------------------------
      # Build Service
      # --------------------------------------------------------

      - name: Build Service
        run: |
          dotnet build ./${{ matrix.service }} \
            --no-restore \
            --configuration Release


      # ========================================================
      # Identity Tests
      # ========================================================

      - name: Run Identity Unit Tests
        if: matrix.service == 'identity'
        run: |
          dotnet test \
            ./identity/Identity.Service.Tests/Identity.Service.Tests.csproj \
            --configuration Release \
            --verbosity normal


      - name: Run Identity Integration Tests
        if: matrix.service == 'identity'
        run: |
          dotnet test \
            ./identity/Identity.Service.IntegrationTests/Identity.Service.IntegrationTests.csproj \
            --configuration Release \
            --verbosity normal


      # ========================================================
      # Resource Tests
      # ========================================================

      - name: Run Resource Unit Tests
        if: matrix.service == 'resource'
        run: |
          dotnet test \
            ./resource/Resource.Service.Tests/Resource.Service.Tests.csproj \
            --configuration Release \
            --verbosity normal


      - name: Run Resource Integration Tests
        if: matrix.service == 'resource'
        run: |
          dotnet test \
            ./resource/Resource.Service.IntegrationTests/Resource.Service.IntegrationTests.csproj \
            --configuration Release \
            --verbosity normal


      # ========================================================
      # Authorization Tests
      # ========================================================

      - name: Run Authorization Unit Tests
        if: matrix.service == 'AuthorizationService'
        run: |
          dotnet test \
            ./AuthorizationService.Tests/AuthorizationService.Tests.csproj \
            --configuration Release \
            --verbosity normal


      # ========================================================
      # Gateway
      #
      # Gateway currently has no test project.
      # ========================================================

      - name: Gateway Test Status
        if: matrix.service == 'gateway'
        run: |
          echo "Gateway build completed successfully."
          echo "No Gateway test project is currently configured."


  # ============================================================
  # 2. CI - Validate Docker Compose
  # ============================================================

  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    needs:
      - test-and-verify

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Docker Buildx
      # --------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # --------------------------------------------------------
      # Create CI Environment
      #
      # These values exist ONLY for CI Compose validation/build.
      # They are not production credentials.
      # --------------------------------------------------------

      - name: Create CI Environment File
        run: |
          cat > .env <<'EOF'
          DB_USER=ci_user
          DB_PASSWORD=ci_password

          IDENTITY_DB_NAME=identity_db
          RESOURCE_DB_NAME=resource_db
          AUTHORIZATION_DB_NAME=authorization_db

          IDENTITY_DB_PORT=5433
          RESOURCE_DB_PORT=5434
          AUTHORIZATION_DB_PORT=5435

          GATEWAY_PORT=8080

          ALLOWED_ORIGINS=http://localhost:3000

          # Required by identity_svc/resource_svc at startup (throws if missing).
          # CI-only value — never a real secret.
          JWT_SIGNING_KEY=ci-only-signing-key-not-a-real-secret

          KAFKA_BOOTSTRAP_SERVERS=kafka:9092
          KAFKA_EXTERNAL_BOOTSTRAP_SERVERS=localhost:29092
          KAFKA_PORT=29092
          KAFKA_UI_PORT=8085
          KAFKA_TEST_TOPIC=pam.test.events
          EOF


      # --------------------------------------------------------
      # Validate Docker Compose
      # --------------------------------------------------------

      - name: Validate Docker Compose
        run: |
          docker compose config


      # --------------------------------------------------------
      # Build Docker Compose Services
      #
      # identity_svc
      # resource_svc
      # authorization_svc
      # gateway_svc
      #
      # PostgreSQL images are pulled from Docker Hub.
      # --------------------------------------------------------

      - name: Build Docker Compose Services
        run: |
          docker compose build


      # --------------------------------------------------------
      # Start the Full Stack (SCRUM-27 AC-5)
      #
      # Verifies the entire stack — all databases, Kafka, all four
      # .NET services, and the gateway — actually starts and reaches
      # a healthy state together, not just that images build.
      # --------------------------------------------------------

      - name: Start Full Stack
        run: |
          docker compose up -d


      # --------------------------------------------------------
      # Wait for All Services to Report Healthy
      #
      # Polls docker compose ps for up to 3 minutes. Fails fast and
      # dumps logs from any service still unhealthy at timeout, so a
      # CI failure here points directly at the broken service.
      # --------------------------------------------------------

      - name: Wait for Healthy Stack
        run: |
          timeout 180 bash -c '
            until [ -z "$(docker compose ps --status running --format json | \
              python3 -c "import sys,json; [print(1) for l in sys.stdin if l.strip() and json.loads(l).get(\"Health\") not in (\"healthy\",\"\")]")" ]; do
              echo "Waiting for all services to become healthy...";
              docker compose ps;
              sleep 5;
            done
          ' || (echo "Stack did not become healthy in time. Dumping logs:"; docker compose logs; exit 1)
          docker compose ps


      # --------------------------------------------------------
      # Clean Up
      # --------------------------------------------------------

      - name: Clean Up
        if: always()
        run: |
          docker compose down -v


  # ============================================================
  # 3. CD - Build & Push Images to Azure Container Registry
  # ============================================================

  build-and-push-acr:
    name: Build & Push Docker Image (${{ matrix.service }})

    needs:
      - test-and-verify
      - validate-compose

    # Only push on actual pushes to main or deploy/production.
    # Pull requests never push images to ACR.
    if: >
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/deploy/production' ||
        github.ref == 'refs/heads/main'
      )

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:

          - service: identity
            image_name: identity_svc

          - service: resource
            image_name: resource_svc

          - service: AuthorizationService
            image_name: authorization_svc

          - service: gateway
            image_name: gateway_svc


    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Docker Buildx
      # --------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # --------------------------------------------------------
      # Login to Azure Container Registry
      # --------------------------------------------------------

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}


      # --------------------------------------------------------
      # Build & Push Docker Image
      # --------------------------------------------------------

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile

          push: true

          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.image_name }}:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.image_name }}:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max

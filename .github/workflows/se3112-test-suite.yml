name: SE3112 Unified Test Suite

# CI-only testing for Bismarck's existing deployment.
# Only a whitelisted subset of lifecycle tests may create test requests.
# Do not use this workflow to exercise real JIT grants or revocations in production.
on:
  push:
    branches:
      - feature/se3112-unified-testing-pipeline

permissions:
  contents: read

concurrency:
  group: se3112-test-suite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-tests:
    name: Backend • .NET tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Discover and run backend test projects
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' projects < <(find . -type f -name '*Tests.csproj' -not -path '*/obj/*' -print0 | sort -z)
          if (( ${#projects[@]} == 0 )); then
            echo 'No backend test projects found'; exit 1
          fi
          echo "Found ${#projects[@]} backend test projects"
          for project in "${projects[@]}"; do
            echo "::group::Testing $project"
            slug="$(echo "$project" | tr '/ .' '___')"
            dotnet test "$project" --configuration Release \
              --logger trx --collect:'XPlat Code Coverage' \
              --results-directory "${GITHUB_WORKSPACE}/TestResults/${slug}" \
              -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
            echo '::endgroup::'
          done
      - name: Upload .NET test results and OpenCover files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: se3112-dotnet-test-results
          path: TestResults/
          retention-days: 7
          if-no-files-found: warn

  frontend-tests:
    name: Frontend • Vitest + lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout frontend source
        uses: actions/checkout@v4
        with:
          repository: BismarckPAM/bismarck-frontend
          ref: deploy/production
          path: bismarck-frontend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bismarck-frontend/package-lock.json
      - name: Install and verify
        working-directory: bismarck-frontend
        run: |
          npm ci
          npm run lint
          npm run test:run
          npm run build

  playwright-public:
    name: Playwright • public browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Peformance_and_e2e_Tests/playwright
    env:
      FRONTEND_URL: ${{ secrets.E2E_FRONTEND_URL }}
      API_URL: ${{ secrets.E2E_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Peformance_and_e2e_Tests/playwright/package-lock.json
      - name: Check URLs
        shell: bash
        run: |
          test -n "$FRONTEND_URL" && test -n "$API_URL" || {
            echo 'Missing E2E_FRONTEND_URL or E2E_API_URL repository secret'; exit 1;
          }
      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run public tests
        run: npm run test:public
      - name: Upload public Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: se3112-playwright-public
          path: |
            Peformance_and_e2e_Tests/playwright/playwright-report/
            Peformance_and_e2e_Tests/playwright/test-results/
          retention-days: 3
          if-no-files-found: ignore

  playwright-authenticated:
    name: Playwright • authenticated + controlled test requests (no JIT grants)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: se3112-test
    defaults:
      run:
        working-directory: Peformance_and_e2e_Tests/playwright
    env:
      FRONTEND_URL: ${{ secrets.E2E_FRONTEND_URL }}
      API_URL: ${{ secrets.E2E_API_URL }}
      E2E_DEV_EMAIL: ${{ secrets.E2E_DEV_EMAIL }}
      E2E_DEV_PASSWORD: ${{ secrets.E2E_DEV_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_OTHER_EMAIL: ${{ secrets.E2E_OTHER_EMAIL }}
      E2E_OTHER_PASSWORD: ${{ secrets.E2E_OTHER_PASSWORD }}
      E2E_RESOURCE_ID: ${{ secrets.E2E_RESOURCE_ID }}
      E2E_ALLOW_WRITES: 'true'
      E2E_LEVEL: '1'
      E2E_DURATION_MINUTES: '5'
    steps:
      - uses: actions/checkout@v4
      - name: Validate known application hosts and test credentials
        shell: bash
        run: |
          set -euo pipefail
          for key in FRONTEND_URL API_URL E2E_DEV_EMAIL E2E_DEV_PASSWORD E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD E2E_RESOURCE_ID; do
            test -n "${!key}" || { echo "Missing environment/repository secret: $key"; exit 1; }
          done
          python3 - <<'PY'
          import os, sys, uuid
          from urllib.parse import urlsplit
          allowed = {
              'FRONTEND_URL': 'frontend-ui.mangopond-f3cfcd27.southeastasia.azurecontainerapps.io',
              'API_URL': 'gateway.mangopond-f3cfcd27.southeastasia.azurecontainerapps.io',
          }
          for name, hostname in allowed.items():
              u = urlsplit(os.environ[name])
              if (u.scheme != 'https' or u.hostname != hostname or u.username or u.password or
                      u.path not in ('', '/') or u.query or u.fragment):
                  sys.exit(f'{name} must be the expected Bismarck HTTPS origin')
          try:
              uuid.UUID(os.environ['E2E_RESOURCE_ID'])
          except ValueError:
              sys.exit('E2E_RESOURCE_ID must be a valid UUID')
          print('Expected frontend/gateway hosts and test resource UUID verified.')
          PY
      - name: Verify dedicated non-VM test resource through the real API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          api = os.environ['API_URL'].rstrip('/')
          data = json.dumps({'email':os.environ['E2E_DEV_EMAIL'], 'password':os.environ['E2E_DEV_PASSWORD']}).encode()
          req = urllib.request.Request(api + '/api/identity/auth/login', data=data, headers={'Content-Type':'application/json'}, method='POST')
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  login = json.load(response)
              token = login.get('token')
              if not token: sys.exit('Test developer login did not return a token')
              req = urllib.request.Request(api + '/api/resources', headers={'Authorization':'Bearer ' + token}, method='GET')
              with urllib.request.urlopen(req, timeout=20) as response:
                  resources = json.load(response)
          except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as e:
              sys.exit('Test account login/resource lookup failed: ' + type(e).__name__)
          resource = next((r for r in resources if str(r.get('id','')).lower() == os.environ['E2E_RESOURCE_ID'].lower()), None)
          if resource is None: sys.exit('E2E_RESOURCE_ID is not present in the resource inventory')
          if (not str(resource.get('name','')).upper().startswith('SE3112-') or
                  str(resource.get('environment','')).upper() != 'TESTING' or
                  str(resource.get('type','')).upper() == 'VM' or
                  any(resource.get(field) for field in ('azureVmName','azureResourceGroup','azureResourceId','publicHost'))):
              sys.exit('Refusing write tests: resource must be named SE3112-*, tagged TESTING, non-VM, and have no Azure/cloud host target')
          print('Dedicated TESTING/non-VM resource verified; no VM or cloud target detected.')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Peformance_and_e2e_Tests/playwright/package-lock.json
      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run authenticated read, resilience, and allowlisted request-only tests
        # E2E-42,46,47 create PENDING test requests; fixture rejects them in teardown.
        # E2E-40,41,43-45 and all security tests are excluded, not silently passed.
        run: |
          npx playwright test \
            --project=read --project=resilience --project=lifecycle \
            --grep 'E2E-(1[0-9]|2[0-4]|3[0-4]|42|46|47)(\.| )'
      - name: Upload authenticated Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: se3112-playwright-authenticated-limited
          path: |
            Peformance_and_e2e_Tests/playwright/playwright-report/
            Peformance_and_e2e_Tests/playwright/test-results/
          retention-days: 1
          if-no-files-found: ignore

  k6-baseline:
    name: k6 • production read-only 2-VU baseline (existing JWT)
    needs: [playwright-authenticated]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: se3112-test
    env:
      BASE_URL: ${{ secrets.K6_BASE_URL }}
      ACCESS_TOKEN: ${{ secrets.K6_ACCESS_TOKEN }}
      API_URL: ${{ secrets.E2E_API_URL }}
      ENDPOINT: resources
      V2_PROFILE: baseline
      MAX_VUS: '2'
      THINK_TIME_SECONDS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Validate authorized read-only performance target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BASE_URL" && test -n "$ACCESS_TOKEN" && test -n "$API_URL" || {
            echo 'Missing K6_BASE_URL, K6_ACCESS_TOKEN or E2E_API_URL'; exit 1;
          }
          python3 - <<'PY'
          import os, sys
          from urllib.parse import urlsplit
          allowed = 'gateway.mangopond-f3cfcd27.southeastasia.azurecontainerapps.io'
          for key in ('BASE_URL','API_URL'):
              u = urlsplit(os.environ[key])
              if u.scheme != 'https' or u.hostname != allowed or u.path not in ('','/') or u.query or u.fragment or u.username or u.password:
                  sys.exit(f'{key} must target the configured Bismarck API gateway HTTPS origin')
          print('Target allowlist passed; running GET /api/resources only, at 2 VUs.')
          PY
          status="$(curl -sS --connect-timeout 10 --max-time 20 \
            -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $ACCESS_TOKEN" "${BASE_URL%/}/api/resources")"
          if [ "$status" != '200' ]; then
            echo "Read-only resource authorization failed (HTTP $status). K6_ACCESS_TOKEN may have expired."
            exit 1
          fi
      - name: Install k6
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main' | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
      - name: Execute threshold-gated read-only k6 baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Peformance_and_e2e_Tests/k6/results
          k6 run --summary-export Peformance_and_e2e_Tests/k6/results/ci-summary.json \
            Peformance_and_e2e_Tests/k6/tests/advanced.test.js
      - name: Upload k6 threshold summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: se3112-k6-summary
          path: Peformance_and_e2e_Tests/k6/results/ci-summary.json
          retention-days: 7
          if-no-files-found: ignore

  sonar-analysis:
    name: SonarQube • .NET code quality + coverage
    needs: [backend-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify SonarQube configuration
        run: |
          test -n "$SONAR_HOST_URL" && test -n "$SONAR_TOKEN" || {
            echo 'Missing SONAR_HOST_URL or SONAR_TOKEN'; exit 1;
          }
      # The backend-tests job still uploads its coverage artifact independently.
      # SonarScanner must instrument the test project builds inside its own
      # begin/end session to discover all test modules and map coverage reliably.
      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner
      - name: Restore service dependencies
        run: |
          set -e
          for service in identity resource AuthorizationService Approval Audit Notification Analytics gateway; do
            dotnet restore "./${service}"
          done
      - name: Sonar begin
        run: |
          dotnet sonarscanner begin \
            /k:'bismarck-backend' \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths='**/TestResults/**/coverage.opencover.xml' \
            /d:sonar.cs.vstest.reportsPaths='**/TestResults/**/*.trx' \
            /d:sonar.coverage.exclusions='**/*Tests*/**,**/Migrations/**'
      - name: Build all services for SonarQube
        run: |
          set -e
          for service in identity resource AuthorizationService Approval Audit Notification Analytics gateway; do
            dotnet build "./${service}" --no-restore --configuration Release
          done
      - name: Run all .NET tests inside SonarScanner session
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TestResults
          mapfile -d '' projects < <(find . -type f -name '*Tests.csproj' -print0 | sort -z)
          if [ "${#projects[@]}" -eq 0 ]; then
            echo 'ERROR: No .NET test projects found'
            exit 1
          fi
          echo "Discovered ${#projects[@]} test projects for SonarQube"
          for project in "${projects[@]}"; do
            echo "Testing ${project}"
            dotnet test "$project" \
              --configuration Release \
              --logger trx \
              --collect:'XPlat Code Coverage' \
              --results-directory ./TestResults \
              -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
          done
          n_reports="$(find TestResults -type f -name 'coverage.opencover.xml' | wc -l)"
          n_trx="$(find TestResults -type f -name '*.trx' | wc -l)"
          echo "Produced $n_reports OpenCover files and $n_trx TRX test reports"
          if [ "$n_reports" -lt "${#projects[@]}" ] || [ "$n_trx" -lt "${#projects[@]}" ]; then
            echo 'ERROR: Coverage or TRX files are missing for one or more projects'
            exit 1
          fi
      - name: Sonar end
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  suite-summary:
    name: Unified • results summary (production-constrained)
    needs: [backend-tests, frontend-tests, playwright-public, playwright-authenticated, k6-baseline, sonar-analysis]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report all outcomes and reject missing checks
        shell: bash
        env:
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
          FRONTEND_RESULT: ${{ needs.frontend-tests.result }}
          PUBLIC_RESULT: ${{ needs.playwright-public.result }}
          AUTH_RESULT: ${{ needs.playwright-authenticated.result }}
          K6_RESULT: ${{ needs.k6-baseline.result }}
          SONAR_RESULT: ${{ needs.sonar-analysis.result }}
        run: |
          {
            echo '## SE3112 Bismarck unified test suite — production-constrained'
            echo '| Job | Result |'
            echo '| --- | --- |'
            echo "| Backend .NET + coverage | $BACKEND_RESULT |"
            echo "| Frontend Vitest + build | $FRONTEND_RESULT |"
            echo "| Playwright public UI (E2E-01..05) | $PUBLIC_RESULT |"
            echo "| Playwright authenticated/read/resilience + limited request-only tests | $AUTH_RESULT |"
            echo "| k6 GET-only resources baseline (2 VUs) | $K6_RESULT |"
            echo "| SonarQube | $SONAR_RESULT |"
            echo ''
            echo '**Not executed:** lifecycle E2E-40,41,43-45 and security E2E-50..54; particularly, no live JIT grant/revoke E2E test is run.'
            echo 'E2E-42,46,47 create test requests and attempt to reject PENDING requests during teardown; production audit/history records may remain.'
            echo 'A successful run is evidence for executed tests only, not full coverage of every committed E2E case.'
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "$BACKEND_RESULT" "$FRONTEND_RESULT" "$PUBLIC_RESULT" "$AUTH_RESULT" "$K6_RESULT" "$SONAR_RESULT"; do
            if [[ "$result" != 'success' ]]; then
              echo 'A required executed testing layer failed or did not run.'
              exit 1
            fi
          done

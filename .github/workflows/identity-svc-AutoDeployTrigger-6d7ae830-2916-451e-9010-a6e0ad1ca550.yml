name: Trigger auto deployment for identity-svc

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ deploy/production ]
    paths:
    - 'identity/**'
    - '.github/workflows/identity-svc-AutoDeployTrigger-6d7ae830-2916-451e-9010-a6e0ad1ca550.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.IDENTITYSVC_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.IDENTITYSVC_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.IDENTITYSVC_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: identity/Dockerfile
          _targetLabelKey_: _targetLabel_
          registryUrl: bismarckregistry.azurecr.io
          registryUsername: ${{ secrets.IDENTITYSVC_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.IDENTITYSVC_REGISTRY_PASSWORD }}
          containerAppName: identity-svc
          resourceGroup: bismarck-pam-rg
          imageToBuild: bismarckregistry.azurecr.io/identity-svc:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_



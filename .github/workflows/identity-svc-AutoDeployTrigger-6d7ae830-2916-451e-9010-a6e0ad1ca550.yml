name: Trigger auto deployment for identity-svc

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ deploy/production ]
    paths:
    - 'identity/**'
    - 'BuildingBlocks/**'
    - '.github/workflows/identity-svc-AutoDeployTrigger-6d7ae830-2916-451e-9010-a6e0ad1ca550.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: bismarckregistry.azurecr.io
          username: ${{ secrets.IDENTITYSVC_REGISTRY_USERNAME }}
          password: ${{ secrets.IDENTITYSVC_REGISTRY_PASSWORD }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          # Build context MUST be the repository root: identity/Dockerfile copies
          # BuildingBlocks/Messaging/, a SIBLING of identity/.
          context: .
          file: identity/Dockerfile
          push: true
          tags: bismarckregistry.azurecr.io/identity-svc:${{ github.sha }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.IDENTITYSVC_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.IDENTITYSVC_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.IDENTITYSVC_AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container App
        uses: azure/cli@v2
        with:
          inlineScript: |
            az config set extension.use_dynamic_install=yes_without_prompt
            az containerapp update \
              --name identity-svc \
              --resource-group bismarck-pam-rg \
              --image bismarckregistry.azurecr.io/identity-svc:${{ github.sha }}


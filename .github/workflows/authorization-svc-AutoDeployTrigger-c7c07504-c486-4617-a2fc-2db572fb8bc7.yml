name: Trigger auto deployment for authorization-svc

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ deploy/production ]
    paths:
    - 'AuthorizationService/**'
    - 'BuildingBlocks/**'
    - '.github/workflows/authorization-svc-AutoDeployTrigger-c7c07504-c486-4617-a2fc-2db572fb8bc7.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: bismarckregistry.azurecr.io
          username: ${{ secrets.AUTHORIZATIONSVC_REGISTRY_USERNAME }}
          password: ${{ secrets.AUTHORIZATIONSVC_REGISTRY_PASSWORD }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          # Build context MUST be the repository root: AuthorizationService/
          # Dockerfile copies BuildingBlocks/Messaging/, a SIBLING of it.
          context: .
          file: AuthorizationService/Dockerfile
          push: true
          tags: bismarckregistry.azurecr.io/authorization-svc:${{ github.sha }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AUTHORIZATIONSVC_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AUTHORIZATIONSVC_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AUTHORIZATIONSVC_AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container App
        uses: azure/cli@v2
        with:
          inlineScript: |
            az config set extension.use_dynamic_install=yes_without_prompt
            az containerapp update \
              --name authorization-svc \
              --resource-group bismarck-pam-rg \
              --image bismarckregistry.azurecr.io/authorization-svc:${{ github.sha }}

